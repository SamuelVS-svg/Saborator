<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBurger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D1808" />
      <stop offset="100%" stop-color="#1A0A03" />
    </linearGradient>
    <linearGradient id="goldGradBurger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE7A3" />
      <stop offset="50%" stop-color="#E5A638" />
      <stop offset="100%" stop-color="#9C6B14" />
    </linearGradient>
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2994A" />
      <stop offset="100%" stop-color="#B95B16" />
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="60" fill="url(#bgGradBurger)" />
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#goldGradBurger)" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.8" />

  <g transform="translate(28, 28)">
    <!-- Pan Superior -->
    <path d="M 6 26 C 6 8, 58 8, 58 26 Z" fill="url(#bunGrad)" />
    <!-- Semillas de sésamo -->
    <ellipse cx="22" cy="18" rx="1.5" ry="0.8" fill="#FFFDF9" transform="rotate(-15 22 18)" />
    <ellipse cx="32" cy="14" rx="1.5" ry="0.8" fill="#FFFDF9" transform="rotate(5 32 14)" />
    <ellipse cx="42" cy="19" rx="1.5" ry="0.8" fill="#FFFDF9" transform="rotate(20 42 19)" />
    
    <!-- Lechuga con ondas -->
    <path d="M 4 28 Q 12 33 20 28 Q 28 33 36 28 Q 44 33 52 28 Q 60 33 62 28 L 62 31 Q 52 35 44 31 Q 36 35 28 31 Q 20 35 12 31 Q 4 33 4 30 Z" fill="#27AE60" />

    <!-- Tomate -->
    <rect x="7" y="32" width="50" height="4" rx="2" fill="#EB5757" />

    <!-- Queso derretido -->
    <path d="M 6 37 L 58 37 L 54 44 L 40 40 L 32 46 L 24 39 L 6 39 Z" fill="#F2C94C" />

    <!-- Carne Angus asada -->
    <rect x="5" y="42" width="54" height="9" rx="4.5" fill="#5A2E14" />
    <line x1="12" y1="46" x2="22" y2="46" stroke="#3D1808" stroke-width="1.2" stroke-linecap="round" />
    <line x1="28" y1="46" x2="42" y2="46" stroke="#3D1808" stroke-width="1.2" stroke-linecap="round" />
    <line x1="46" y1="46" x2="52" y2="46" stroke="#3D1808" stroke-width="1.2" stroke-linecap="round" />

    <!-- Pan Inferior -->
    <path d="M 8 53 C 8 51, 56 51, 56 53 C 56 60, 8 60, 8 53 Z" fill="url(#bunGrad)" />
  </g>
</svg>
