<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCocktail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2433" />
      <stop offset="100%" stop-color="#080E17" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E056FD" />
      <stop offset="50%" stop-color="#FF7675" />
      <stop offset="100%" stop-color="#FDCB6E" />
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="60" fill="url(#bgGradCocktail)" />
  <circle cx="60" cy="60" r="54" fill="none" stroke="#74B9FF" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.6" />

  <g transform="translate(32, 25)">
    <!-- Rodaja de Lima / Cítrico en el borde -->
    <circle cx="16" cy="12" r="9" fill="#00B894" />
    <circle cx="16" cy="12" r="7.5" fill="#55EFC4" />
    <line x1="16" y1="5" x2="16" y2="19" stroke="#00B894" stroke-width="1" />
    <line x1="9" y1="12" x2="23" y2="12" stroke="#00B894" stroke-width="1" />

    <!-- Copa Martini / Coctel Cristal -->
    <path d="M 6 16 L 50 16 L 30 46 L 26 46 Z" fill="rgba(255, 255, 255, 0.15)" stroke="#DFE6E9" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Líquido aromático -->
    <path d="M 11 23 L 45 23 L 28 44 Z" fill="url(#liquidGrad)" />

    <!-- Tallo de la copa -->
    <line x1="28" y1="46" x2="28" y2="65" stroke="#DFE6E9" stroke-width="3" stroke-linecap="round" />

    <!-- Base de la copa -->
    <path d="M 14 65 C 14 65, 28 64, 42 65" stroke="#DFE6E9" stroke-width="3.5" stroke-linecap="round" />

    <!-- Aceituna / Agitador con pincho -->
    <line x1="22" y1="4" x2="38" y2="36" stroke="#C8973A" stroke-width="1.8" stroke-linecap="round" />
    <ellipse cx="33" cy="26" rx="3.5" ry="4.5" fill="#E17055" transform="rotate(-30 33 26)" />
    <circle cx="33" cy="26" r="1.2" fill="#FFEAA7" />
  </g>
</svg>
