    <linearGradient id="fireInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F2994A" />
      <stop offset="80%" stop-color="#FFEAA7" />
      <stop offset="100%" stop-color="#FFFFFF" />
