  </defs>
  <rect width="120" height="120" rx="60" fill="url(#bgGradFlame)" />
  <circle cx="60" cy="60" r="54" fill="none" stroke="#F2994A" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.7" />

