<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1428" />
      <stop offset="100%" stop-color="#0B0612" />
    </linearGradient>
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4DC" />
      <stop offset="40%" stop-color="#ECC66C" />
      <stop offset="80%" stop-color="#C59635" />
      <stop offset="100%" stop-color="#8E6516" />
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="60" fill="url(#bgGradStar)" />
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#goldStar)" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.8" />

  <g transform="translate(32, 28)">
    <!-- Corona de Laureles Gastronómicos -->
    <path d="M 12 48 C 6 36, 8 20, 16 12 C 14 18, 14 26, 17 32" stroke="url(#goldStar)" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 44 48 C 50 36, 48 20, 40 12 C 42 18, 42 26, 39 32" stroke="url(#goldStar)" stroke-width="2" fill="none" stroke-linecap="round" />
    
    <!-- Hojas de laurel izquierda -->
    <ellipse cx="11" cy="24" rx="3.5" ry="2" fill="url(#goldStar)" transform="rotate(-30 11 24)" />
    <ellipse cx="10" cy="34" rx="3.5" ry="2" fill="url(#goldStar)" transform="rotate(-15 10 34)" />
    <ellipse cx="13" cy="44" rx="3.5" ry="2" fill="url(#goldStar)" transform="rotate(10 13 44)" />
    
    <!-- Hojas de laurel derecha -->
    <ellipse cx="45" cy="24" rx="3.5" ry="2" fill="url(#goldStar)" transform="rotate(30 45 24)" />
    <ellipse cx="46" cy="34" rx="3.5" ry="2" fill="url(#goldStar)" transform="rotate(15 46 34)" />
    <ellipse cx="43" cy="44" rx="3.5" ry="2" fill="url(#goldStar)" transform="rotate(-10 43 44)" />

    <!-- Estrella Michelin de 8 puntas / Gran Florón Culinario -->
    <path d="M 28 6 L 31 20 L 44 14 L 35 24 L 46 32 L 32 32 L 31 46 L 26 33 L 13 40 L 21 28 L 10 22 L 23 18 Z" fill="url(#goldStar)" />
    <circle cx="28" cy="26" r="3.5" fill="#FFFDF9" />
  </g>
</svg>
